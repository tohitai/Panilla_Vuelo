<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OTP Logger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap');

  :root {
    --bg: #0a0e1a;
    --panel: #111827;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --warn: #ffd700;
    --green: #00ff88;
    --text: #e2e8f0;
    --muted: #4a6080;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Barlow Condensed', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #0d1b2e 0%, #111827 100%);
    border-bottom: 2px solid var(--accent);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .header-title {
    font-family: var(--sans);
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 2px;
    color: white;
  }
  .live-clock {
    font-family: var(--mono);
    font-size: 18px;
    color: var(--green);
    letter-spacing: 2px;
  }

  /* SCREENS */
  .screen { display: none; padding: 16px; }
  .screen.active { display: block; }

  /* SETUP SCREEN */
  .setup-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .setup-title {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 3px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .form-row.full { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  label {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  input, select, textarea {
    background: #0d1b2e;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 8px 10px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }
  textarea { resize: none; font-size: 13px; }
  select option { background: #0d1b2e; }

  /* TRAMO NAV */
  .tramo-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .tramo-tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tramo-tab.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: bold;
  }
  .tramo-tab.done { border-color: var(--green); color: var(--green); }

  /* BIG LOG BUTTON */
  .log-btn-wrap { padding: 8px 0 16px; }
  .log-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent) 0%, #0096cc 100%);
    border: none;
    border-radius: 10px;
    color: var(--bg);
    font-family: var(--sans);
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 3px;
    padding: 18px;
    cursor: pointer;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    transition: transform 0.1s;
    box-shadow: 0 4px 20px rgba(0,212,255,0.3);
  }
  .log-btn:active { transform: scale(0.97); }
  .log-btn .btn-time {
    display: block;
    font-family: var(--mono);
    font-size: 28px;
    letter-spacing: 4px;
    margin-bottom: 2px;
  }
  .log-btn .btn-label { font-size: 13px; opacity: 0.8; letter-spacing: 4px; }

  /* QUICK HITOS */
  .quick-title {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .quick-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .quick-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 8px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }
  .quick-btn:active { background: #1a2a40; border-color: var(--accent); }
  .quick-btn .q-icon { font-size: 16px; display: block; margin-bottom: 2px; }
  .quick-btn.logged { border-color: var(--green); color: var(--green); }

  /* CUSTOM NOTE */
  .custom-note-wrap {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .custom-note-wrap input {
    flex: 1;
    font-size: 13px;
  }
  .add-note-btn {
    background: var(--accent2);
    border: none;
    border-radius: 6px;
    color: white;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 13px;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 1px;
  }
  .add-note-btn:active { opacity: 0.8; }

  /* TIMELINE */
  .timeline-header {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .clear-last {
    background: none;
    border: 1px solid var(--muted);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 3px;
    cursor: pointer;
  }
  .timeline {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    min-height: 80px;
    max-height: 260px;
    overflow-y: auto;
    margin-bottom: 16px;
  }
  .tl-entry {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 5px 0;
    border-bottom: 1px solid rgba(30,45,69,0.6);
    animation: fadeIn 0.2s ease;
  }
  .tl-entry:last-child { border-bottom: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
  .tl-time {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    white-space: nowrap;
    min-width: 44px;
  }
  .tl-text {
    font-size: 13px;
    line-height: 1.4;
    color: var(--text);
    flex: 1;
  }
  .tl-empty {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 20px 0;
  }

  /* SECTION DIVIDER */
  .section-div {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent2);
    letter-spacing: 3px;
    text-align: center;
    padding: 8px 0;
    border-top: 1px dashed var(--border);
    border-bottom: 1px dashed var(--border);
    margin: 12px 0;
    text-transform: uppercase;
  }

  /* ACTION BUTTONS */
  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 8px;
  }
  .action-btn {
    border: none;
    border-radius: 8px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 14px;
    cursor: pointer;
    text-transform: uppercase;
    transition: opacity 0.15s;
  }
  .action-btn:active { opacity: 0.8; }
  .btn-report {
    background: linear-gradient(135deg, var(--accent2) 0%, #cc4400 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(255,107,53,0.3);
  }
  .btn-copy {
    background: linear-gradient(135deg, #1e2d45 0%, #2a3f5f 100%);
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn-next {
    background: linear-gradient(135deg, var(--green) 0%, #00aa55 100%);
    color: var(--bg);
    grid-column: 1 / -1;
    font-size: 16px;
  }
  .btn-new-tramo {
    background: var(--panel);
    border: 1px dashed var(--accent);
    color: var(--accent);
    border-radius: 8px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 2px;
    padding: 12px;
    width: 100%;
    cursor: pointer;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* REPORT SCREEN */
  .report-box {
    background: #050d18;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 16px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 55vh;
    overflow-y: auto;
    margin-bottom: 14px;
  }
  .copy-full-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent) 0%, #0096cc 100%);
    border: none;
    border-radius: 8px;
    color: var(--bg);
    font-family: var(--sans);
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 2px;
    padding: 16px;
    cursor: pointer;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .back-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    padding: 12px;
    cursor: pointer;
    letter-spacing: 1px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green);
    color: var(--bg);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: bold;
    padding: 10px 24px;
    border-radius: 30px;
    letter-spacing: 2px;
    transition: transform 0.3s ease;
    z-index: 999;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* AI REPORT loader */
  .ai-loader {
    text-align: center;
    padding: 30px;
    font-family: var(--mono);
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 2px;
  }
  .ai-loader .dot { animation: blink 1.2s infinite; }
  .ai-loader .dot:nth-child(2) { animation-delay: 0.2s; }
  .ai-loader .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:1} }

  .otp-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 3px;
    font-size: 11px;
    font-family: var(--mono);
    font-weight: bold;
    letter-spacing: 1px;
    margin-left: 8px;
  }
  .otp-ok { background: var(--green); color: var(--bg); }
  .otp-delay { background: var(--accent2); color: white; }

  .tramo-phase {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent2);
    letter-spacing: 2px;
    margin: 10px 0 6px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tramo-phase::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .info-cabina-wrap textarea { height: 70px; }

  /* OCULTAR en setup cuando no aplica */
  .fase-llegada { display: none; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="header-logo">LATAM · OTP</div>
    <div class="header-title">GROUNDING</div>
  </div>
  <div class="live-clock" id="liveClock">00:00</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">✓ COPIADO</div>

<!-- ===== SCREEN: SETUP ===== -->
<div class="screen active" id="screenSetup">
  <div class="setup-card">
    <div class="setup-title">// Configurar Turno</div>
    <div class="form-row">
      <div class="form-group">
        <label>N° Tramos</label>
        <select id="numTramos">
          <option value="1">1 tramo</option>
          <option value="2" selected>2 tramos</option>
          <option value="3">3 tramos</option>
          <option value="4">4 tramos</option>
        </select>
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="fecha">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>GCE</label>
        <input type="text" id="gce" placeholder="Nombre">
      </div>
    </div>
  </div>

  <!-- TRAMOS SETUP -->
  <div id="tramosSetupContainer"></div>

  <button class="action-btn btn-next" onclick="startLogging()" style="margin-top:8px;">
    ✈ INICIAR TURNO
  </button>
</div>

<!-- ===== SCREEN: LOGGING ===== -->
<div class="screen" id="screenLog">
  <!-- Tramo tabs -->
  <div class="tramo-nav" id="tramoNav"></div>

  <!-- Big log button -->
  <div class="log-btn-wrap">
    <button class="log-btn" onclick="logNow()">
      <span class="btn-time" id="btnTime">00:00</span>
      <span class="btn-label">REGISTRAR HITO</span>
    </button>
  </div>

  <!-- Custom note input -->
  <div class="custom-note-wrap">
    <input type="text" id="customNote" placeholder="Descripción del hito (opcional)..." maxlength="200">
    <button class="add-note-btn" onclick="logNow()">+ LOG</button>
  </div>

  <!-- Quick hitos -->
  <div class="quick-title">// HITOS RÁPIDOS</div>
  <div class="quick-grid" id="quickGrid"></div>

  <!-- Timeline -->
  <div class="timeline-header">
    <span>// REGISTRO ACTUAL</span>
    <button class="clear-last" onclick="clearLast()">← BORRAR ÚLTIMO</button>
  </div>
  <div class="timeline" id="timeline">
    <div class="tl-empty">Sin registros aún</div>
  </div>

  <!-- Actions -->
  <div id="tramoBtns"></div>
</div>

<!-- ===== SCREEN: REPORT ===== -->
<div class="screen" id="screenReport">
  <div style="font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:3px;margin-bottom:12px;">// INFORME GENERADO</div>
  <div class="report-box" id="reportBox">Generando...</div>
  <button class="copy-full-btn" onclick="copyReport()">📋 COPIAR INFORME</button>
  <button class="back-btn" onclick="showScreen('screenLog')">← VOLVER AL LOG</button>
</div>

<script>
// ============================================================
// STATE
// ============================================================
let state = {
  tramos: [],        // array de objetos por tramo
  currentTramo: 0,
  numTramos: 2,
  fecha: '',
  gce: '',
};

// Hitos rápidos por fase
const HITOS_SALIDA = [
  { icon: '🅿️', label: 'TC-TM En Gate' },
  { icon: '✈️', label: 'TC-TM ingreso avión' },
  { icon: '✅', label: 'Chequeo prevuelo ok' },
  { icon: '📋', label: 'Briefing operacional ok' },
  { icon: '🧹', label: 'Sube aseo' },
  { icon: '🧹', label: 'Baja aseo' },
  { icon: '🟢', label: 'Embarque autorizado' },
  { icon: '🧑', label: '1er pax embarcando' },
  { icon: '🏁', label: 'Último pax embarcando' },
  { icon: '📦', label: 'Entrega despacho' },
  { icon: '🚪', label: 'Cierre de puertas' },
];

const HITOS_LLEGADA = [
  { icon: '🛬', label: 'Avión detenido en Posta' },
  { icon: '🔓', label: 'Apertura de puertas' },
  { icon: '🧑', label: '1er pax desembarcando' },
  { icon: '🏁', label: 'Último pax desembarcando' },
  { icon: '🧹', label: 'Sube aseo' },
  { icon: '🧹', label: 'Baja aseo' },
  { icon: '🟢', label: 'Embarque autorizado' },
  { icon: '🧑', label: '1er pax embarcando' },
  { icon: '🏁', label: 'Último pax embarcando' },
  { icon: '📦', label: 'Entrega despacho' },
  { icon: '🚪', label: 'Cierre de puertas' },
];

const HITOS_FINAL = [
  { icon: '🛬', label: 'Avión detenido BASE SCL' },
  { icon: '🔓', label: 'Apertura de puertas' },
  { icon: '🏁', label: 'Último pax desembarcando' },
  { icon: '👩‍✈️', label: 'Baja tripulación cabina' },
];

// ============================================================
// CLOCK
// ============================================================
function pad(n) { return String(n).padStart(2,'0'); }
function getNow() {
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function tick() {
  const t = getNow();
  document.getElementById('liveClock').textContent = t;
  document.getElementById('btnTime').textContent = t;
}
setInterval(tick, 1000);
tick();

// ============================================================
// SETUP SCREEN
// ============================================================
function initSetup() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('fecha').value = today;
  renderTramosSetup();
  document.getElementById('numTramos').addEventListener('change', renderTramosSetup);
}

function renderTramosSetup() {
  const n = parseInt(document.getElementById('numTramos').value);
  state.numTramos = n;
  const c = document.getElementById('tramosSetupContainer');
  c.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const isFirst = i === 0;
    const card = document.createElement('div');
    card.className = 'setup-card';
    card.innerHTML = `
      <div class="setup-title">// TRAMO ${i+1} ${isFirst ? '— SALIDA' : i === n-1 && n > 1 ? '— LLEGADA FINAL' : '— INTERMEDIO'}</div>
      <div class="form-row">
        <div class="form-group">
          <label>N° Vuelo</label>
          <input type="text" id="t${i}_vuelo" placeholder="LA 607">
        </div>
        <div class="form-group">
          <label>Ruta</label>
          <input type="text" id="t${i}_ruta" placeholder="SCL-GRU">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Avión (REG)</label>
          <input type="text" id="t${i}_avion" placeholder="CC-BAZ">
        </div>
        <div class="form-group">
          <label>STD</label>
          <input type="time" id="t${i}_std">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>ARR TIME</label>
          <input type="time" id="t${i}_arr">
        </div>
        <div class="form-group">
          <label>OTP</label>
          <input type="text" id="t${i}_otp" placeholder="TAT 35 / 1ra salida">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Tipo avión</label>
          <input type="text" id="t${i}_tipo" placeholder="A320-200">
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group info-cabina-wrap">
          <label>Info Cabina (pax, esp. necesidades)</label>
          <textarea id="t${i}_cabina" placeholder="16/130&#10;2 WCHS, 3 CHD, 1 INF&#10;13 HVC"></textarea>
        </div>
      </div>
    `;
    c.appendChild(card);
  }
}

function startLogging() {
  const n = state.numTramos;
  state.fecha = document.getElementById('fecha').value;
  state.gce = document.getElementById('gce').value;
  state.tramos = [];
  for (let i = 0; i < n; i++) {
    state.tramos.push({
      vuelo: document.getElementById(`t${i}_vuelo`).value || `Tramo ${i+1}`,
      ruta: document.getElementById(`t${i}_ruta`).value || '',
      avion: document.getElementById(`t${i}_avion`).value || '',
      std: document.getElementById(`t${i}_std`).value || '',
      arr: document.getElementById(`t${i}_arr`).value || '',
      otp: document.getElementById(`t${i}_otp`).value || '',
      tipo: document.getElementById(`t${i}_tipo`).value || '',
      cabina: document.getElementById(`t${i}_cabina`).value || '',
      log: [],
      fase: 'salida', // salida | llegada | final
    });
  }
  state.currentTramo = 0;
  renderLogScreen();
  showScreen('screenLog');
}

// ============================================================
// LOG SCREEN
// ============================================================
function renderLogScreen() {
  renderTramoNav();
  renderQuickGrid();
  renderTimeline();
  renderTramoBtns();
}

function renderTramoNav() {
  const nav = document.getElementById('tramoNav');
  nav.innerHTML = '';
  state.tramos.forEach((t, i) => {
    const tab = document.createElement('button');
    tab.className = 'tramo-tab' + (i === state.currentTramo ? ' active' : '') + (t.fase === 'final' && i < state.currentTramo ? ' done' : '');
    tab.textContent = `${t.vuelo} ${t.ruta}`;
    tab.onclick = () => { state.currentTramo = i; renderLogScreen(); };
    nav.appendChild(tab);
  });
}

function renderQuickGrid() {
  const grid = document.getElementById('quickGrid');
  grid.innerHTML = '';
  const t = state.tramos[state.currentTramo];
  const isFirst = state.currentTramo === 0;
  const isLast = state.currentTramo === state.numTramos - 1;

  let hitos;
  if (t.fase === 'salida') {
    hitos = HITOS_SALIDA;
  } else if (t.fase === 'llegada' && !isLast) {
    hitos = HITOS_LLEGADA;
  } else {
    hitos = HITOS_FINAL.concat(HITOS_LLEGADA.slice(0,7));
  }

  hitos.slice(0, 12).forEach(h => {
    const btn = document.createElement('button');
    const alreadyLogged = t.log.some(e => e.text === h.label);
    btn.className = 'quick-btn' + (alreadyLogged ? ' logged' : '');
    btn.innerHTML = `<span class="q-icon">${h.icon}</span>${h.label}`;
    btn.onclick = () => {
      addLog(h.label);
      btn.classList.add('logged');
    };
    grid.appendChild(btn);
  });
}

function renderTimeline() {
  const tl = document.getElementById('timeline');
  const t = state.tramos[state.currentTramo];
  if (!t.log.length) {
    tl.innerHTML = '<div class="tl-empty">Sin registros aún...</div>';
    return;
  }
  tl.innerHTML = '';
  t.log.forEach(entry => {
    const div = document.createElement('div');
    div.className = 'tl-entry';
    div.innerHTML = `<span class="tl-time">${entry.time}</span><span class="tl-text">${entry.text}</span>`;
    tl.appendChild(div);
  });
  tl.scrollTop = tl.scrollHeight;
}

function renderTramoBtns() {
  const wrap = document.getElementById('tramoBtns');
  const isLast = state.currentTramo === state.numTramos - 1;
  const t = state.tramos[state.currentTramo];

  wrap.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'action-row';

  const btnCopy = document.createElement('button');
  btnCopy.className = 'action-btn btn-copy';
  btnCopy.textContent = '📋 COPIAR LOG';
  btnCopy.onclick = copyCurrentLog;

  const btnReport = document.createElement('button');
  btnReport.className = 'action-btn btn-report';
  btnReport.textContent = '⚡ GENERAR INFORME OTP';
  btnReport.onclick = generateReport;
  btnReport.style.gridColumn = '1 / -1';

  row.appendChild(btnCopy);

  if (!isLast) {
    const btnNext = document.createElement('button');
    btnNext.className = 'action-btn';
    btnNext.style.background = 'linear-gradient(135deg, var(--warn) 0%, #cc9900 100%)';
    btnNext.style.color = '#000';
    btnNext.textContent = '→ TRAMO SIGUIENTE';
    btnNext.onclick = nextTramo;
    row.appendChild(btnNext);
  } else {
    const spacer = document.createElement('div');
    row.appendChild(spacer);
  }

  row.appendChild(btnReport);
  wrap.appendChild(row);
}

// ============================================================
// LOGGING ACTIONS
// ============================================================
function logNow() {
  const noteInput = document.getElementById('customNote');
  const note = noteInput.value.trim();
  const time = getNow();
  const text = note || '— hito registrado —';
  addLog(text);
  noteInput.value = '';
}

function addLog(text) {
  const time = getNow();
  state.tramos[state.currentTramo].log.push({ time, text });
  renderTimeline();
  renderQuickGrid();
}

function clearLast() {
  const t = state.tramos[state.currentTramo];
  if (t.log.length) {
    t.log.pop();
    renderTimeline();
    renderQuickGrid();
  }
}

function nextTramo() {
  if (state.currentTramo < state.numTramos - 1) {
    state.currentTramo++;
    renderLogScreen();
    document.getElementById('screenLog').scrollTop = 0;
  }
}

// ============================================================
// COPY LOG
// ============================================================
function copyCurrentLog() {
  const t = state.tramos[state.currentTramo];
  let text = `${t.vuelo} ${t.ruta} — ${state.fecha}\n`;
  text += `STD: ${t.std} | ARR: ${t.arr} | OTP: ${t.otp}\n`;
  text += `Avión: ${t.avion} ${t.tipo}\n`;
  text += `───────────────────\n`;
  t.log.forEach(e => { text += `${e.time}  ${e.text}\n`; });
  copyToClipboard(text);
}

// ============================================================
// GENERATE OTP REPORT (IA)
// ============================================================
async function generateReport() {
  showScreen('screenReport');
  document.getElementById('reportBox').innerHTML = `
    <div class="ai-loader">
      GENERANDO INFORME OTP<br>
      <span class="dot">●</span><span class="dot">●</span><span class="dot">●</span>
    </div>`;

  // Build prompt
  let prompt = `Eres el sistema de registro OTP de LATAM Airlines. Genera un informe de vuelo profesional y conciso en español basado en los siguientes datos de turno.\n\n`;
  prompt += `FECHA: ${state.fecha}\nGCE: ${state.gce || 'No indicado'}\n\n`;

  state.tramos.forEach((t, i) => {
    prompt += `=== TRAMO ${i+1}: ${t.vuelo} ${t.ruta} ===\n`;
    prompt += `Avión: ${t.avion} ${t.tipo}\nSTD: ${t.std} | ARR TIME: ${t.arr} | OTP: ${t.otp}\n`;
    if (t.cabina) prompt += `INFO CABINA:\n${t.cabina}\n`;
    prompt += `REGISTRO CRONOLÓGICO:\n`;
    t.log.forEach(e => { prompt += `${e.time}  ${e.text}\n`; });
    prompt += '\n';
  });

  prompt += `\nGenera el informe con este formato:
1. Encabezado por tramo con datos del vuelo
2. Línea de tiempo de hitos en formato HH:MM — evento
3. Si hay atrasos, identifica la causa y redacta una justificación breve para el comité OTP
4. Resumen final del turno con OTP de cada tramo
5. Sección GCE al final si aplica
Sé preciso, técnico y usa terminología aeronáutica LATAM.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await resp.json();
    const text = data.content?.map(b => b.text || '').join('\n') || 'Error al generar informe.';
    document.getElementById('reportBox').textContent = text;
  } catch(e) {
    document.getElementById('reportBox').textContent = buildManualReport();
  }
}

function buildManualReport() {
  let out = `INFORME OTP — ${state.fecha}\n`;
  out += `GCE: ${state.gce || '—'}\n`;
  out += `${'═'.repeat(40)}\n\n`;
  state.tramos.forEach((t, i) => {
    out += `TRAMO ${i+1}: ${t.vuelo} ${t.ruta}\n`;
    out += `Avión: ${t.avion} ${t.tipo}\n`;
    out += `STD: ${t.std}  ARR: ${t.arr}  OTP: ${t.otp}\n`;
    if (t.cabina) out += `Cabina: ${t.cabina.replace(/\n/g,' | ')}\n`;
    out += `${'─'.repeat(30)}\n`;
    t.log.forEach(e => { out += `${e.time}  ${e.text}\n`; });
    out += '\n';
  });
  return out;
}

// ============================================================
// UTILS
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function copyReport() {
  const text = document.getElementById('reportBox').textContent;
  copyToClipboard(text);
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast());
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast();
  }
}

function showToast(msg = '✓ COPIADO') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// INIT
// ============================================================
initSetup();
</script>
